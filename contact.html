<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact FreeToolsHub — Reach Us Directly</title>
  <meta name="description" content="Contact FreeToolsHub via a simple Formspree form. Ask questions, suggest features, or report bugs.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://freetoolshub.pages.dev/contact.html">
  <style>
    :root{--primary:#6366f1;--bg:#f9fafb;--text:#1f2937;--card:#ffffff;--border:#e5e7eb}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:0;line-height:1.6}
    .container{max-width:600px;margin:auto;padding:2rem 1.25rem}
    header{background:var(--primary);color:#fff;padding:1.5rem;text-align:center}
    label{display:block;margin-top:1rem;font-weight:500}
    input,textarea{width:100%;box-sizing:border-box;padding:.6rem .75rem;border:1px solid var(--border);border-radius:8px;margin-top:.3rem;font-family:inherit}
    button{background:var(--primary);color:#fff;border:none;padding:.65rem 1.25rem;border-radius:8px;cursor:pointer;margin-top:1rem;font-size:1rem}
    button:hover{background:#4f46e5}
    a{color:var(--primary);text-decoration:none}
    .back{margin-bottom:1.25rem;display:inline-block;font-weight:600}
    footer{background:var(--card);border-top:1px solid var(--border);padding:1.25rem;margin-top:2rem;text-align:center}
  </style>
</head>
<body>
<header>
  <h1>Contact FreeToolsHub</h1>
</header>
<div class="container">
  <a href="index.html" class="back">← Back to Home</a>
  <p>We love hearing from you! Use the form below to send us a message via Formspree.</p>
  <!-- TODO BEFORE GOING LIVE: Replace "xxxxxxxx" with your actual 
       Formspree form ID. Sign up free at https://formspree.io, 
       create a new form, and copy the ID from the form's endpoint URL. -->
  <form action="https://formspree.io/f/xxxxxxxx" method="POST">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" required placeholder="Your name">

    <label for="email">Email</label>
    <input type="email" id="email" name="_replyto" required placeholder="you@example.com">

    <label for="message">Message</label>
    <textarea id="message" name="message" rows="6" required placeholder="Your question, suggestion, or bug report"></textarea>

    <button type="submit">Send Message</button>
  </form>

  <p style="margin-top:1.5rem">Or email us directly at <a href="mailto:contact@freetoolshub.pages.dev">contact@freetoolshub.pages.dev</a>.</p>
</div>

<footer>
  © <span id="yr"></span> FreeToolsHub — All rights reserved.
</footer>
<script>document.getElementById('yr').textContent = new Date().getFullYear();</script>
</body>
</html>
